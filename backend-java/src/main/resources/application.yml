server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://121.40.124.210:3306/stock_app?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.stockapp.mapper: debug

app:
  schedule:
    hour: 16
    minute: 0
  llm:
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${LLM_MODEL:deepseek-chat}
